<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashCards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f7f7; --white:#ffffff;
  --green:#58cc02; --green-dk:#46a302; --green-lt:#d7ffb8;
  --blue:#1cb0f6;  --blue-dk:#0099d0;
  --red:#ff4b4b;   --red-lt:#ffdfe0;
  --yellow:#ffc800;
  --gray:#afafaf;  --gray-lt:#e5e5e5;
  --text:#3c3c3c;  --border:#e5e5e5;
  --radius:16px;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}

/* ── SETUP SCREEN ── */
#setup{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px;padding-bottom:80px;}
.setup-title{font-size:26px;font-weight:900;color:var(--text);text-align:center;margin-bottom:4px;}
.setup-sub{font-size:14px;color:var(--gray);text-align:center;font-weight:600;}
.setup-section-label{font-size:13px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.setup-collapse-body{overflow:hidden;max-height:0;transition:max-height .4s ease;}
.setup-collapse-body.open{max-height:4000px;}

/* Source toggles */


.src-btn.active{color:#fff;border-color:transparent;}
.src-btn[data-mode="pt"].active    {background:#8b5cf6;}
.src-btn[data-mode="drug"].active  {background:#ef4444;}
.src-btn[data-mode="flags"].active {background:#f59e0b;}
.src-btn[data-mode="herbs"].active {background:#10b981;}
.src-btn[data-mode="english"].active{background:#3b82f6;}

/* Category accordion */
.cat-section{margin-bottom:10px;width:100%;}
.cat-accordion-header{
  display:flex;align-items:center;
  width:100%;padding:14px 20px;border-radius:12px;cursor:pointer;
  color:#fff;font-size:14px;font-weight:800;
  user-select:none;box-sizing:border-box;
}

.cat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 4px;}
.cat-chips-wrap{overflow:hidden;max-height:0;transition:max-height .6s ease;}
.cat-chips-wrap.open{max-height:3000px;}
.topic-chip{display:block;margin-bottom:2px;border-radius:10px;padding:8px 14px;transition:transform .15s,background .2s,color .2s;touch-action:pan-y;}
.topic-chip:active{transform:scale(0.97);}
.cat-chip{
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:99px;cursor:pointer;
  border:2px solid;background:var(--white);
  transition:all .15s;
}
.cat-chip.on{color:#fff;}


/* Quantity & mode row */
.setup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.setup-row-label{font-size:13px;font-weight:700;color:var(--gray);white-space:nowrap;}
.qty-btn,.gtype-btn{
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  padding:7px 16px;border-radius:99px;cursor:pointer;
  border:none;background:var(--white);color:var(--gray);
  box-shadow:0 1px 6px rgba(0,0,0,.08);transition:all .15s;
}
.qty-btn.active{background:#d4a85a;border-color:#b08840;color:#fff;box-shadow:0 2px 0 #b08840;}
.gtype-btn.active{background:var(--blue);border-color:var(--blue-dk);color:#fff;box-shadow:0 2px 0 var(--blue-dk);}

/* Start button */
.btn-start{margin-top:32px;width:100%;padding:16px;background:#2d2926;color:#fff;border:none;border-radius:var(--radius);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;transition:transform .1s;}
.btn-start-fixed{
  position:fixed;bottom:0;left:0;right:0;
  padding:18px;background:#6a9a5e;color:#fff;
  border:none;
  font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;
  cursor:pointer;z-index:100;
  box-shadow:0 -2px 16px rgba(0,0,0,.12);
  transition:background .15s;display:none;
}
.btn-start-fixed:active{background:#1a1614;}
.btn-start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk);}

/* ── GAME SCREEN ── */
#game{width:100%;max-width:560px;}

/* Game header */
.game-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 12px;border-bottom:2px solid var(--border);margin-bottom:16px;
}
.game-title{font-size:15px;font-weight:900;color:var(--text);}
.btn-back{
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;
  padding:6px 14px;border-radius:99px;cursor:pointer;
  border:2px solid var(--border);background:var(--white);color:var(--gray);
}

/* Progress */
.prog-wrap{width:100%;margin-bottom:16px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prog-label{font-size:13px;font-weight:700;color:var(--gray);}
.streak-badge{font-size:13px;font-weight:800;color:var(--yellow);}
.prog-bar{height:10px;background:var(--gray-lt);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s ease;width:0%;}
.prog-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:6px;background:rgba(255,255,255,.4);border-radius:99px;}
.prog-bar{position:relative;}
.streak-dots{display:flex;gap:5px;margin-top:8px;}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--gray-lt);transition:background .25s;}
.sdot.hit{background:var(--green);}
.sdot.miss{background:var(--red);}

/* Card badge (source + category) */
.card-badge-wrap{
  display:flex;gap:6px;align-items:center;
  position:absolute;top:14px;right:14px;
}
.badge{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;color:#fff;
}

/* Card */
.scene{width:100%;max-width:560px;height:250px;perspective:1200px;cursor:pointer;margin-bottom:14px;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,0,.2,1);}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;background:var(--card-bg,var(--white));border-radius:var(--radius);border:none;box-shadow:0 2px 8px rgba(0,0,0,.07);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px;gap:10px;transition:background .3s,border-color .3s;}
.card-face.back{transform:rotateY(180deg);background:var(--card-bg-back,#f0fff0);border:none;}
.card-word{font-size:clamp(28px,6vw,46px);font-weight:900;color:var(--text);text-align:center;line-height:1.15;direction:ltr;}
.card-sub{font-size:13px;font-weight:600;color:var(--gray);}
.card-answer{font-size:clamp(20px,4.5vw,32px);font-weight:800;color:var(--green-dk);text-align:center;line-height:1.25;}
.card-hint{position:absolute;bottom:14px;font-size:12px;font-weight:600;color:var(--gray);}
.card-cat-label{
  position:absolute;bottom:12px;left:14px;
  font-size:10px;font-weight:700;color:rgba(0,0,0,0.28);
  letter-spacing:0.5px;text-transform:uppercase;
  line-height:1.5;text-align:left;
}
.tts-btn-answer{
  background:none;border:none;font-size:18px;cursor:pointer;
  opacity:0.45;transition:opacity .2s;padding:4px;
}
.tts-btn-answer:hover{opacity:1;}
.tts-btn-answer.hidden{display:none;}
.tts-btn{position:absolute;top:12px;left:12px;background:none;border:none;font-size:20px;cursor:pointer;opacity:1;transition:opacity .2s,transform .15s;padding:4px;}
.tts-btn:hover{transform:scale(1.15);}
.tts-btn.tts-off{opacity:.25;filter:grayscale(1);}
.tts-btn.speaking{animation:tts-pulse .55s infinite alternate;}
@keyframes tts-pulse{from{transform:scale(1)}to{transform:scale(1.25)}}
.card-face.flash-ok{animation:fl-ok .4s;}
.card-face.flash-bad{animation:fl-bad .4s;}
@keyframes fl-ok{0%,100%{background:#f0fff0}50%{background:#c6f7c6}}
@keyframes fl-bad{0%,100%{background:#fff0f0}50%{background:#ffc6c6}}

.flip-back-link{font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;text-decoration:underline;text-align:center;margin-bottom:8px;display:none;}

/* Buttons */
.btn-flip{width:100%;padding:14px;border-radius:var(--radius);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;background:var(--white);color:var(--blue);border:none;box-shadow:0 1px 8px rgba(0,0,0,.09);cursor:pointer;margin-bottom:12px;transition:transform .1s;}
.btn-flip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-dk);}
.btn-row{width:100%;display:flex;gap:10px;}
.btn-answer{flex:1;padding:14px;border-radius:var(--radius);font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s,box-shadow .1s;border:2px solid;}
.btn-answer:active{transform:translateY(2px);}
.btn-wrong{background:#f5eded;color:var(--red);border:none;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.btn-wrong:active{box-shadow:0 1px 0 #e0a0a0;}
.btn-right{background:var(--green);color:#fff;border:none;box-shadow:0 1px 8px rgba(0,0,0,.12);}
.btn-right:active{box-shadow:0 1px 0 var(--green-dk);}
.btn-row.hidden,.btn-flip.hidden{display:none;}

/* Quiz */
.quiz-wrap{width:100%;display:none;flex-direction:column;gap:12px;}
.quiz-q-card{width:100%;background:var(--card-bg,var(--white));border:none;border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.07);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-height:150px;justify-content:center;transition:background .3s,border-color .3s;}
.quiz-word{font-size:clamp(24px,5.5vw,40px);font-weight:900;color:var(--text);text-align:center;direction:ltr;line-height:1.2;}
.quiz-sub{font-size:13px;font-weight:600;color:var(--gray);}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quiz-opt{padding:14px 12px;border-radius:var(--radius);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;text-align:right;line-height:1.3;cursor:pointer;background:var(--white);color:var(--text);border:none;box-shadow:0 1px 6px rgba(0,0,0,.07);transition:all .15s;display:flex;align-items:center;gap:6px;}
.quiz-opt:hover:not(:disabled){background:#edf3f8;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.1);}
.quiz-opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--border);}
.quiz-opt.correct{background:var(--green-lt);border:none;color:var(--green-dk);box-shadow:0 1px 6px rgba(0,0,0,.07);}
.quiz-opt.wrong{background:var(--red-lt);border:none;color:var(--red);box-shadow:0 1px 6px rgba(0,0,0,.07);}
.quiz-opt.reveal{background:var(--green-lt);border:none;color:var(--green-dk);}
.quiz-opt:disabled{cursor:default;}
.quiz-feedback{text-align:center;font-size:15px;font-weight:800;min-height:22px;}
.quiz-feedback.ok{color:var(--green);}
.quiz-feedback.bad{color:var(--red);}
.btn-got-it{width:100%;padding:14px;background:var(--red);color:#fff;border:none;box-shadow:0 1px 8px rgba(0,0,0,.1);border-radius:var(--radius);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.btn-got-it:active{transform:translateY(2px);box-shadow:0 1px 0 #cc0000;}
.btn-got-it.hidden{display:none;}

/* Stats */
.stats{width:100%;display:flex;gap:10px;margin-top:18px;}
.stat-box{flex:1;background:var(--white);border:none;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.06);padding:12px 8px;text-align:center;}
.stat-val{font-size:22px;font-weight:900;}
.stat-lbl{font-size:11px;font-weight:700;color:var(--gray);margin-top:2px;}
.g{color:var(--green);}.r{color:var(--red);}.b{color:var(--blue);}

/* Finish */
#finish{text-align:center;gap:16px;width:100%;max-width:560px;margin-top:40px;}
#finish .big{font-size:72px;}
#finish h2{font-size:30px;font-weight:900;}
#finish p{font-size:16px;font-weight:600;color:var(--gray);}
.btn-restart{padding:16px 48px;background:var(--green);color:#fff;border:none;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:var(--radius);cursor:pointer;font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;margin-top:4px;}
.btn-back-finish{padding:12px 32px;background:var(--white);color:var(--gray);border:none;box-shadow:0 1px 6px rgba(0,0,0,.07);border-radius:var(--radius);cursor:pointer;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;margin-top:4px;}

/* Category color system */
/* Each unique (source,cat) combo gets a color via JS-injected inline styles */


.screen { display:none; }
.screen.active{display:block;min-height:100vh;}

/* ── CONFETTI ── */
.confetti-piece {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  border-radius: 2px;
  animation: confetti-fall linear forwards;
  pointer-events: none;
  z-index: 9999;
}
@keyframes confetti-fall {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
}
.yoohoo {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 52px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  z-index: 9998;
  animation: yoohoo-pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  pointer-events: none;
  white-space: nowrap;
}
@keyframes yoohoo-pop {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
  60%  { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
}

body.dark{--bg:#0f0e0d;--white:#1e1c1a;--text:#f0e8dd;--gray:#9a9088;--border:#3a3530;--gray-lt:#2a2520;--green:#7ab86e;--green-dk:#5a9a4e;--green-lt:#1a2e18;--red:#cc7a7a;--red-lt:#2e1818;--yellow:#c8a850;--blue:#7aaac8;}
body.dark .cat-accordion-header{filter:brightness(0.7);}
body.dark .quiz-opt{background:var(--white);color:var(--text);}
body.dark .stat-box{background:var(--white);color:var(--text);}
body.dark .btn-start-fixed{background:#4a7a3e;}
body.dark .topic-chip{border-color:#555 !important;}
body.dark .topic-chip:not(.on){background:var(--white) !important;color:var(--gray) !important;}
.q-prompt{font-size:12px;color:var(--gray);font-weight:600;margin-bottom:4px;text-align:center;}
</style>

<div id="screen-setup" class="screen active">
<div id="setup" class="page">

<script>
// ── TWO-FINGER DRAG SELECT ON ACCORDION HEADERS ──
(function() {
  let _hdrDragMode = null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 2) return;
    const hdr = e.target.closest('.cat-accordion-header');
    if (!hdr) return;
    const wrap = hdr.nextElementSibling;
    if (!wrap || !wrap.dataset.src) return;
    const src = wrap.dataset.src;
    const anyActive = [...activeCatKeys].some(k => k.startsWith(src + '|'));
    _hdrDragMode = !anyActive; // if off → turn on; if on → turn off
    applyHeader(hdr, wrap, src, _hdrDragMode);
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || _hdrDragMode === null) return;
    e.preventDefault();
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const el = document.elementFromPoint(mx, my);
    const hdr = el && el.closest('.cat-accordion-header');
    if (!hdr) return;
    const wrap = hdr.nextElementSibling;
    if (!wrap || !wrap.dataset.src) return;
    applyHeader(hdr, wrap, wrap.dataset.src, _hdrDragMode);
  }, {passive:false});

  document.addEventListener('touchend', e => {
    if (e.touches.length === 0) _hdrDragMode = null;
  });

  function applyHeader(hdr, wrap, src, on) {
    const sc = SOURCE_COLORS[src];
    wrap.querySelectorAll('.topic-chip').forEach(chip => {
      applyChip(chip, on);
    });
    hdr.style.background = on ? sc.bg : '#c0bab4';
    hdr.style.opacity    = on ? '1' : '0.6';
  }
})();


// ── CELEBRATION ──
function launchConfetti() {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6fc8','#c77dff','#f4a261','#2ec4b6'];
  const emojis = ['🎉','🎊','⭐','💥','🔥','✨','🌟','💫'];
  const count = 120;

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const isEmoji = Math.random() < 0.2;
      if (isEmoji) {
        piece.style.cssText = 'background:none;font-size:20px;width:auto;height:auto;';
        piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      } else {
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        const size = 6 + Math.random()*10;
        piece.style.width  = size + 'px';
        piece.style.height = size + 'px';
        if (Math.random() < 0.3) piece.style.borderRadius = '50%';
      }
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.animationDuration = (1.5 + Math.random()*2.5) + 's';
      piece.style.animationDelay    = (Math.random()*0.5) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4000);
    }, i * 15);
  }

  // Yoohoo text
  const msgs = ['יוהוווו! 🎉','מושלם! 💥','100%! ⭐','אלוף! 🏆','מדהים! 🔥'];
  const yoo = document.createElement('div');
  yoo.className = 'yoohoo';
  yoo.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  document.body.appendChild(yoo);
  setTimeout(() => {
    yoo.style.transition = 'opacity 0.5s';
    yoo.style.opacity = '0';
    setTimeout(() => yoo.remove(), 600);
  }, 2000);

  // Sound — play multiple cheerful beeps via AudioContext
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523, 659, 784, 1047, 784, 1047, 1319];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i*0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.25);
      osc.start(ctx.currentTime + i*0.12);
      osc.stop(ctx.currentTime + i*0.12 + 0.3);
    });
  } catch(e) {}
}

// ── PAGE ROUTER ──
function showPage(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
  document.getElementById('btnStart').style.display = name === 'setup' ? 'block' : 'none';
  if (name === 'game') {
    const g = document.getElementById('game');
    g.classList.remove('hidden'); g.style.display = 'flex';
    const f = document.getElementById('finish');
    f.classList.add('hidden'); f.style.display = 'none';
    bootGame();
  }
}

const catIndexMap = {};
function getCatStyle(source, cat) {
  const key = source + '|' + cat;
  if (catIndexMap[key] === undefined) {
    const sameSource = Object.keys(catIndexMap).filter(k => k.startsWith(source + '|'));
    catIndexMap[key] = sameSource.length;
  }
  const idx = catIndexMap[key];
  const sc  = SOURCE_COLORS[source];
  // Strict alternating: odd = full color, even = 55% opacity (light)
  const op = (idx % 2 === 0) ? 1.0 : 0.55;
  return { bg: sc.bg + Math.round(op*255).toString(16).padStart(2,'0'),
           border: sc.border };
}

function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getCatStyle(source, cat) {
  const key = source + '|' + cat;
  if (catIndexMap[key] === undefined) {
    const sameSource = Object.keys(catIndexMap).filter(k => k.startsWith(source + '|'));
    catIndexMap[key] = sameSource.length;
  }
  const idx = catIndexMap[key];
  const sc  = SOURCE_COLORS[source];
  // Generate shades: alternate between slightly lighter and slightly darker tones
  // by reducing opacity over the source color on a white background
  // We'll use opacity steps: 1.0, 0.82, 0.68, 0.56, 0.46, 0.38, cycling
  const opacities = [1.0, 0.82, 0.68, 0.56, 0.78, 0.62, 0.9, 0.72, 0.5, 0.85];
  const op = opacities[idx % opacities.length];
  return { bg: sc.bg + Math.round(op*255).toString(16).padStart(2,'0'),
           border: sc.border };
}

const TEACHER_PROFILES = [
  { pitch: 1.0,  rate: 0.85, gender: 'female' },
  { pitch: 0.75, rate: 0.80, gender: 'male'   },
  { pitch: 1.25, rate: 0.90, gender: 'female' },
  { pitch: 0.85, rate: 0.82, gender: 'male'   },
  { pitch: 1.15, rate: 0.88, gender: 'female' },
  { pitch: 0.70, rate: 0.78, gender: 'male'   },
  { pitch: 1.30, rate: 0.92, gender: 'female' },
  { pitch: 0.90, rate: 0.85, gender: 'male'   },
];

function getCatProfile(source, cat) {
  // Stable hash from source+cat string
  const key = (source || '') + '|' + (cat || '');
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) & 0xffff;
  return TEACHER_PROFILES[h % TEACHER_PROFILES.length];
}

function applyCardColor(source, cat) {
  const sc  = SOURCE_COLORS[source] || {bg:'#ffffff', border:'#e5e5e5', light:'#f7f7f7'};
  const isDark = document.body.classList.contains('dark');
  // In dark mode: use a dark tint; in light mode: use the light pastel
  const bg = isDark ? sc.bg + '33' : (sc.light || '#f7f7f7');
  const border = sc.border;
  const root = document.documentElement;
  root.style.setProperty('--card-bg',      isDark ? '#2a2520' : bg);
  root.style.setProperty('--card-bg-back', isDark ? '#2a2520' : bg);
  root.style.setProperty('--card-border',  border);
}

function getVoices(lang){
  if(!window.speechSynthesis)return null;
  const v=window.speechSynthesis.getVoices();
  return v.find(x=>x.lang===lang)||v.find(x=>x.lang.startsWith(lang.slice(0,5)))||v.find(x=>x.lang.startsWith(lang.slice(0,2)))||null;
}

function getVoiceForProfile(lang, gender) {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  const langVoices = voices.filter(v => v.lang.startsWith(lang.slice(0,2)));
  if (!langVoices.length) return null;
  // Try to match gender by common name patterns
  const femaleHints = ['female','woman','girl','fiona','karen','victoria','samantha','moira','veena','tessa','zoe','alice','amelie','anna','sara'];
  const maleHints   = ['male','man','boy','daniel','alex','jorge','thomas','diego','luca','henrik','nikos','reed','gordon'];
  const hints = gender === 'female' ? femaleHints : maleHints;
  const matched = langVoices.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
  return matched || langVoices[0];
}

function speak(text, lang, source, cat) {
  if (!window.speechSynthesis) return; ttsCancel();
  const u = new SpeechSynthesisUtterance(text.replace(/-/g,' '));
  const profile = getCatProfile(source, cat);
  u.lang   = lang;
  u.rate   = profile.rate;
  u.pitch  = profile.pitch;
  u.volume = 1;
  const v = getVoiceForProfile(lang, profile.gender);
  if (v) u.voice = v;
  const btnId = gameType==='flash' ? 'ttsBtnFlash' : 'ttsBtnQuiz';
  const btn = document.getElementById(btnId);
  if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  setTimeout(() => { try { window.speechSynthesis.speak(u); } catch(e) {} }, 80);
}

function ttsCancel(){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}

function unlockAudio(){
  if(audioUnlocked)return; audioUnlocked=true;
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);setTimeout(()=>c.close(),100);}catch(e){}
}

function buildPool() {
  allCards = [];
  activeModes.forEach(src => {
    const dm = (typeof DATA_MAP_LOCAL !== "undefined" ? DATA_MAP_LOCAL : DATA_MAP) || {};
    (dm[src] || []).forEach(([cat, q, a]) => {
      if (activeCatKeys.has(src + '|' + cat)) {
        allCards.push({ source: src, cat, q, a, reversed: false });

        if (src !== 'flags' && src !== 'japanese') {
          allCards.push({ source: src, cat, q: a, a: q, reversed: true });

      }
    });
  });
}

    'nutrition|ויטמינים': 'Vitamin D is the only vitamin your body can produce from sunlight',
    'drug|פרמקולוגיה': 'Aspirin was synthesized in 1897 and is still one of the most used drugs',
    'drug|אנטומיה': 'The human body has 206 bones and over 600 muscles',
    'spanish|Phrases': 'Spanish is the 2nd most spoken native language in the world',
  };
  const key = card.source + '|' + card.cat;
  return facts[key] || null;
}

function applyChip(chip, on) {
  const key2 = chip.dataset.key;
  if (!key2) return;
  const src2  = key2.split('|')[0];
  const color = chip.style.borderColor;
  if (on && !activeCatKeys.has(key2)) {
    activeCatKeys.add(key2);
    chip.classList.add('on');
    chip.style.background = color;
    chip.style.color = '#fff';
    syncSrcBtn(src2);
  } else if (!on && activeCatKeys.has(key2)) {
    activeCatKeys.delete(key2);
    chip.classList.remove('on');
    chip.style.background = '#fff';
    chip.style.color = color;
    syncSrcBtn(src2);
  }
}

function toggleCat(key, cs, btn) {
  const src = key.split('|')[0];
  if (activeCatKeys.has(key)) {
    activeCatKeys.delete(key);

    btn.style.color = cs.bg; btn.style.background = '#fff';
  } else {
    activeCatKeys.add(key);
    btn.classList.add('on');
    btn.style.color = '#fff'; btn.style.background = cs.bg;
  }
  syncSrcBtn(src);
}

function selectAllSrc(src, on) {
  const wrap = document.querySelector('[data-src="' + src + '"]');
  if (!wrap) return;
  const chips = wrap.querySelectorAll('.cat-chip');
  chips.forEach(btn => {
    const key = btn.dataset.key;
    if (!key) return;
    if (on) {
      activeCatKeys.add(key);
      btn.style.color = '#fff';
      btn.style.background = btn.style.borderColor;
      btn.classList.add('on');
    } else {

      activeCatKeys.delete(key);
      const col = btn.style.borderColor;
      btn.style.color = col;
      btn.style.background = '#fff';
      btn.classList.remove('on');
    }
  });
  syncSrcBtn(src);
}

function syncSrcBtn(src) {
  const anyActive = [...activeCatKeys].some(k => k.startsWith(src + '|'));
  if (anyActive) {
    activeModes.add(src);
  } else {
    if (activeModes.size > 1) activeModes.delete(src);
  }
  // Update accordion header color
  const sc = SOURCE_COLORS[src];
  const hdrs = document.querySelectorAll('.cat-accordion-header');
  hdrs.forEach(hdr => {
    const wrap = hdr.nextElementSibling;
    if (wrap && wrap.dataset.src === src) {
      hdr.style.background = anyActive ? sc.bg : '#c0bab4';
      hdr.style.opacity    = anyActive ? '1' : '0.6';
    }
  });
}

function playCurrentTts() {
  if (!ttsEnabled || !current || current.source === 'flags') return;
  unlockAudio();
  const lm = {pt:'pt-PT', drug:'en-US', herbs:'en-US', english:'en-US', japanese:'ja-JP', nutrition:'en-US', history:'he-IL', blood:'he-IL', spanish:'es-ES'};
  // For Chinese herbs: strip kanji characters (everything after the first non-latin/non-space/non-diacritic char block)
  // e.g. "rén shēn 人參" → "rén shēn"
  let text = current.q;
  let lang = lm[current.source] || 'en-US';
  if (current.reversed && current.source === 'pt') lang = 'en-US';
  if (current.source === 'herbs' && current.cat === 'סיני') {
    // Strip kanji: "rén shēn 人參" → "rén shēn"
    text = text.replace(/[\u4e00-\u9fff\u3400-\u4dbf]+/g, '').trim();
  }
  speak(text, lang, current.source, current.cat);
}

function speakAnswer(e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (!current) return;
  unlockAudio();
  // Speak the answer (current.a) in appropriate language
  const lm = {pt:'pt-PT', drug:'en-US', herbs:'en-US', english:'en-US', japanese:'en-US', nutrition:'en-US', flags:'en-US'};
  // Answer language logic: PT non-reversed → answer is English; PT reversed → answer is Portuguese
  let lang = 'en-US';
  if (current.source === 'pt' && current.reversed)  lang = 'pt-PT';
  if (current.source === 'pt' && !current.reversed) lang = 'en-US';
  // Strip anything after em-dash for cleaner TTS
  let text = current.a.replace(/—.*$/, '').trim();
  speak(text, lang, current.source, current.cat);
}

function speakCurrent(e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  ttsEnabled = !ttsEnabled;
  updateTtsBtns();
  if (ttsEnabled) { playCurrentTts(); } else { ttsCancel(); }
}

function updateProgress() {
  if (isReviewMode) {
    const corrected = allWrong.filter(c => correctSet.has(c.q)).length;
    const total     = allWrong.length;
    const pct       = total > 0 ? Math.min(100, corrected/total*100).toFixed(0) : 0;
    document.getElementById('progLabel').textContent = corrected + ' / ' + total + ' תיקונים';
    document.getElementById('progFill').style.width  = pct + '%';
  } else {
    const target   = sessionSize > 0 ? sessionSize : (sessionTotal||1);
    const answered = rightCount + wrongCount;
    const pct      = Math.min(100, answered/target*100).toFixed(0);
    document.getElementById('progLabel').textContent = answered + ' / ' + target + ' שאלות';
    document.getElementById('progFill').style.width  = pct + '%';
  }
  document.getElementById('streakBadge').textContent = 'רצף ' + streak;
}

function updateStats() {
  updateProgress();
  // In review mode: freeze the first-round stats, only update "remaining"
  if (isReviewMode) {
    document.getElementById('sLeft').textContent = deck.length + wrongPile.length;
    return; // don't update score/right/wrong during review
  }
  const t = rightCount + wrongCount;
  document.getElementById('sRight').textContent = rightCount;
  document.getElementById('sWrong').textContent = wrongCount;
  document.getElementById('sLeft').textContent  = deck.length + wrongPile.length;
  document.getElementById('sPct').textContent   = t > 0 ? Math.round(rightCount/t*100) + '%' : '—';

function nextCard() {
  ttsCancel();
  // In review mode, run until all wrong cards corrected
  if (isReviewMode) {
    if (!deck.length) {
      if (!wrongPile.length) { showFinish(); return; }
      deck = shuffle([...wrongPile]); wrongPile = [];
    }
  } else {
    // Normal mode: stop after sessionSize total questions answered
    const totalAnswered = rightCount + wrongCount;
    if (sessionSize > 0 && totalAnswered >= sessionSize) { showFinish(); return; }
    if (!deck.length) { showFinish(); return; } // ran out of cards
  }
  current = deck.shift();
  updateProgress(); updateStreakDots();
  if (gameType === 'flash') showFlash();
  else showQuiz();
}

function showQuiz() {
  quizLocked = false;
  applyCardColor(current.source, current.cat);
  const isFlag = current.source === 'flags' || current.source === 'japanese';
  document.getElementById('qWord').textContent   = current.q;
  const ql = document.getElementById('qCatLabel');
  if(ql) { const sl = SOURCE_LABELS[current.source] || current.source; ql.innerHTML = sl + '<br>' + current.cat; }
  // Question prompt
  document.getElementById('qPrompt').textContent = getQuestionPrompt(current);
  document.getElementById('qWord').style.fontSize = isFlag ? '72px' : '';
  document.getElementById('qSub').textContent    = (current.source==='drug'||current.source==='herbs') ? current.cat : '';
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className   = 'quiz-feedback';
  const _gi = document.getElementById('btnGotIt');
  _gi.classList.add('hidden');
  _gi.style.background = '';
  const _ff = document.getElementById('quizFact'); if(_ff) _ff.style.opacity='0';

  // Distractors: SAME category first (same source+cat), then same source only, never cross-source
  // Also filter cards where answer shares a word with the question (e.g. Kudzu in both)
  function sharesWord(str1, str2) {
    const words1 = str1.toLowerCase().match(/[a-zא-ת一-鿿]{3,}/g) || [];
    const words2 = new Set((str2.toLowerCase().match(/[a-zא-ת一-鿿]{3,}/g) || []));
    return words1.some(w => words2.has(w));
  }
  const pool = allCards.filter(c =>
    c.q !== current.q &&
    c.a !== current.a &&
    c.reversed === current.reversed &&
    !sharesWord(c.a, current.q) // answer shouldn't share words with question
  );
  const sameCat  = shuffle(pool.filter(c => c.source===current.source && c.cat===current.cat));
  const sameSrc  = shuffle(pool.filter(c => c.source===current.source && c.cat!==current.cat));
  const dist = [];
  for (const src of [sameCat, sameSrc]) {
    while (dist.length < 3 && src.length) dist.push(src.shift());
  }
  // Only use other sources if absolutely not enough options
  if (dist.length < 3) {
    const other = shuffle(pool.filter(c => c.source!==current.source));
    while (dist.length < 3 && other.length) dist.push(other.shift());
  }

  // Deduplicate by answer text — no two options with same displayed answer
  const seen = new Set();
  const uniqueOpts = [];
  for (const opt of shuffle([current, ...dist])) {
    if (!seen.has(opt.a)) { seen.add(opt.a); uniqueOpts.push(opt); }
    if (uniqueOpts.length === 4) break;
  }
  // Emergency fallback: fill from any allCards if still < 4
  if (uniqueOpts.length < 4) {
    const emergency = shuffle(allCards.filter(c =>
      c.q !== current.q && c.a !== current.a && c.reversed === current.reversed &&
      !sharesWord(c.a, current.q)
    ));
    for (const opt of emergency) {
      if (!seen.has(opt.a)) { seen.add(opt.a); uniqueOpts.push(opt); }
      if (uniqueOpts.length === 4) break;
    }
  }
  // If we lost the correct answer due to dedup, ensure it's in
  if (!uniqueOpts.some(o => o.q === current.q)) uniqueOpts[0] = current;
  const opts = shuffle(uniqueOpts);

  playCurrentTts();
  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.dataset.key = opt.q;

    // Answer text
    const bText = document.createElement('span');
    bText.textContent = opt.a;
    bText.style.cssText = 'flex:1;';
    b.appendChild(bText);


    b.onclick = () => pickQuiz(b);
    container.appendChild(b);
  });
}

function pickQuiz(btn) {
  if (quizLocked) return;
  quizLocked = true;
  const correct = btn.dataset.key === current.q;
  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.key === current.q) b.classList.add('reveal');
  });
  if (correct) {
    btn.classList.remove('reveal'); btn.classList.add('correct');
    document.getElementById('quizFeedback').textContent = 'נכון!';
    document.getElementById('quizFeedback').className   = 'quiz-feedback ok';
    // Show fun fact
    const factEl = document.getElementById('quizFact');
    if (factEl) {
      const fact = getFunFact(current);
      if (fact) { factEl.textContent = '💡 ' + fact; factEl.style.opacity='1'; }
      else factEl.style.opacity='0';
    }
    recordAnswer(true);
    if (ttsEnabled) {
      setTimeout(() => {
        const lm = {pt:'pt-PT',drug:'en-US',herbs:'en-US',english:'en-US',japanese:'en-US',nutrition:'en-US',flags:'en-US'};
        let lang = current.reversed && current.source==='pt' ? 'pt-PT' : (lm[current.source]||'en-US');
        speak(current.a.replace(/—.*$/, '').trim(), lang, current.source, current.cat);
      }, 150);
    }
    document.getElementById('btnGotIt').classList.remove('hidden');
  } else {
    btn.classList.add('wrong');
    document.getElementById('quizFeedback').textContent = 'לא נכון — התשובה: ' + current.a;
    document.getElementById('quizFeedback').className   = 'quiz-feedback bad';
    recordAnswer(false);
    document.getElementById('btnGotIt').classList.remove('hidden');
    document.getElementById('btnGotIt').style.background = 'var(--red)';
    if (ttsEnabled) {
      setTimeout(() => {
        const lm = {pt:'pt-PT',drug:'en-US',herbs:'en-US',english:'en-US',japanese:'en-US',nutrition:'en-US',flags:'en-US'};
        let lang = current.reversed && current.source==='pt' ? 'pt-PT' : (lm[current.source]||'en-US');
        speak(current.a.replace(/—.*$/, '').trim(), lang, current.source, current.cat);
      }, 200);
    }
  }
}

const ENCOURAGEMENTS = ["מעולה! המשיכו כך!","יפה מאוד! אתם על הדרך הנכונה!","כך כך! עוד קצת ואתם שם!","אתם מתקדמים יפה מאוד!","ממש טוב! המוח שלכם עובד!","שיא אישי בדרך!","המשיכו — כל תשובה נכונה חורטת את המידע!","פנטסטי! הרצף שלכם מרשים!"];

function recordAnswer(correct) {
  if (correct) {
    correctSet.add(current.q);
    rightCount++; streak++; streakHistory.push(true);
    const target = sessionSize > 0 ? sessionSize : sessionTotal;
    if ([3,5,Math.round(target*.5),Math.round(target*.75),target-1].includes(rightCount) && rightCount < target)
      showEncouragement(ENCOURAGEMENTS[Math.floor(Math.random()*ENCOURAGEMENTS.length)]);
  } else {
    if(!allWrong.some(c=>c.q===current.q)) allWrong.push(current);
    wrongPile.push(current); wrongCount++; streak=0; streakHistory.push(false);
  }
  if (streakHistory.length>8) streakHistory.shift();
  updateStats();
}

function showEncouragement(msg) {
  let el = document.getElementById('enc');
  if (!el) { el=document.createElement('div'); el.id='enc'; el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#58cc02;color:#fff;padding:10px 22px;border-radius:99px;font-family:Nunito,sans-serif;font-weight:800;font-size:15px;z-index:999;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:opacity .4s'; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',2200);
}

function showFinish() {
  isReviewMode = false;
  // Capture first-round stats before review
  if (!firstRoundDone) {
    firstRoundRight = rightCount;
    firstRoundWrong = wrongCount;
    firstRoundDone = true;
  }
  // Check for uncorrected wrongs
  const stillWrong = allWrong.filter(c => !correctSet.has(c.q));
  if (stillWrong.length > 0) {
    showReviewModal(stillWrong.length);
    return;
  }
  // All correct — show proper finish
  const g = document.getElementById('game'); g.classList.add('hidden'); g.style.display = 'none';
  const t=rightCount+wrongCount, p=t>0?Math.round(rightCount/t*100):0;
  const hit=sessionSize>0&&rightCount>=sessionSize;
  let e,ti,m;
  if(hit||p===100){e='🏆';ti='מושלם לחלוטין!';m='כל השאלות נכונות! שלטתם בחומר!';}
  else if(p>=90){e='🌟';ti='מצוין!';m=p+'% — כמעט מושלם! ('+rightCount+'/'+t+')';}
  else if(p>=75){e='🎉';ti='כל הכבוד!';m=p+'% — ממש טוב! ('+rightCount+'/'+t+')';}
  else if(p>=50){e='👍';ti='לא רע!';m=p+'% — עוד קצת תרגול! ('+rightCount+'/'+t+')';}
  else{e='💪';ti='המשיכו לתרגל';m=p+'% — קרה לכולנו! ('+rightCount+'/'+t+')';}
  // Show first-round score
  const t1 = firstRoundRight + firstRoundWrong;
  const pct1 = t1 > 0 ? Math.round(firstRoundRight / t1 * 100) : 0;
  document.getElementById('fScore').textContent = pct1 + '%';
  document.getElementById('fScore').style.color = pct1>=80 ? 'var(--green)' : pct1>=60 ? 'var(--yellow)' : 'var(--red)';
  if (pct1 === 100) setTimeout(launchConfetti, 300);
  else if (pct1 >= 80) setTimeout(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = 880; osc.type = 'sine';
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }, 200);
  document.getElementById('fRight').textContent = firstRoundRight;
  document.getElementById('fWrong').textContent = firstRoundWrong;
  document.getElementById('fTotal').textContent = t1;

  const fin = document.getElementById('finish'); fin.classList.remove('hidden'); fin.style.display = 'flex';
}

function showReviewModal(n) {
  document.getElementById('reviewMsg').textContent = n + ' שאלות שטעית בהן — בוא נעבור עליהן שוב';
  document.getElementById('reviewModal').style.display = 'flex';
}

function closeReview() {
  document.getElementById('reviewModal').style.display = 'none';
  // Mark all wrongs as "accepted" so finish shows
  allWrong.forEach(c => correctSet.add(c.q));
  showFinish();
}

function startReview() {
  document.getElementById('reviewModal').style.display = 'none';
  const stillWrong = allWrong.filter(c => !correctSet.has(c.q));
  if (stillWrong.length === 0) { showFinish(); return; }
  isReviewMode = true;
  deck = shuffle([...stillWrong]);
  wrongPile = [];
  streak = 0; streakHistory = [];
  // Don't reset rightCount/wrongCount — keep cumulative stats
  const gEl2 = document.getElementById('game');
  gEl2.classList.remove('hidden');
  gEl2.style.display = 'flex';
  const _f = document.getElementById('finish'); _f.classList.add('hidden'); _f.style.display = 'none';
  updatePanels(); updateStats(); nextCard();
}

function restart() {
  const _f = document.getElementById('finish'); _f.classList.add('hidden'); _f.style.display = 'none';
  const g = document.getElementById('game'); g.classList.remove('hidden'); g.style.display = 'flex';

}

    if (e.key==='Escape' && isFlipped) unflipCard();
    if ((e.key==='ArrowLeft'||e.key==='2') && isFlipped) answer(true);
    if ((e.key==='ArrowRight'||e.key==='1') && isFlipped) answer(false);
  }
  if (gameType==='quiz') {
    const btns = [...document.querySelectorAll('.quiz-opt:not(:disabled)')];
    const k = parseInt(e.key);
    if (k>=1 && k<=4 && btns[k-1]) btns[k-1].click();
    const g = document.getElementById('btnGotIt');
    if ((e.key==='Enter'||e.key===' ') && g && !g.classList.contains('hidden')) { e.preventDefault(); nextCard(); }
  }
  if (e.key==='s'||e.key==='S') {
    if (current && current.source!=='flags') {
      unlockAudio();
      const lm = {pt:'pt-PT',drug:'en-US',herbs:'en-US',english:'en-US',japanese:'ja-JP',nutrition:'en-US'};
      let _t = current.q;
      if (current.reversed && current.source==='pt') { speak(_t,'en-US',current.source,current.cat); return; }
      if (current.source==='herbs' && current.cat==='סיני') _t = _t.replace(/[\u4e00-\u9fff\u3400-\u4dbf]+/g,'').trim();
      speak(_t, lm[current.source]||'en-US', current.source, current.cat);
    }
  }
});

// ── BOOT: load config from sessionStorage ──
function bootGame() {
  const modes    = sessionStorage.getItem('tok_activeModes');
  const catKeys  = sessionStorage.getItem('tok_activeCatKeys');
  const gt       = sessionStorage.getItem('tok_gameType');
  const ss       = sessionStorage.getItem('tok_sessionSize');
  const cards    = sessionStorage.getItem('tok_allCards');
  const fullPool = sessionStorage.getItem('tok_fullPool');

  if (!cards) { showPage('setup'); return; }

  activeModes   = new Set(JSON.parse(modes));
  activeCatKeys = new Set(JSON.parse(catKeys));
  gameType      = gt || 'quiz';
  sessionSize   = parseInt(ss) || 10;
  // allCards = full pool for distractors, deck = chosen subset for questions
  allCards = fullPool ? JSON.parse(fullPool) : JSON.parse(cards);

  // Build game title
  const SOURCE_LABELS_L = {pt:'פורטוגזית',drug:'רפואה',flags:'דגלים',herbs:'צמחי מרפא',english:'אנגלית',japanese:'יפנית',nutrition:'תזונה'};

  // Start
  const shuffled = shuffle([...allCards]);
  let chosen;
  if (sessionSize > 0) {
    const modesList = [...activeModes];
    const perMode   = Math.ceil(sessionSize * 4 / modesList.length);
    const balanced  = [];
    modesList.forEach(src => {
      const srcCards = shuffle(shuffled.filter(c => c.source === src));
      balanced.push(...srcCards.slice(0, perMode));
    });
    chosen = shuffle(balanced).slice(0, sessionSize * 4);
  } else {
    chosen = shuffled;
  }
  deck = [...chosen];
  sessionTotal = sessionSize > 0 ? sessionSize : chosen.length;
  wrongPile=[]; allWrong=[]; correctSet.clear(); isReviewMode=false;
  rightCount=0; wrongCount=0; streak=0; streakHistory=[];
  firstRoundRight=0; firstRoundWrong=0; firstRoundDone=false;

  updateTtsBtns();
  updatePanels();
  updateStats();
  nextCard();
}
