<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#111;color:#eee;min-height:100vh;overscroll-behavior-y:none;}

/* ── SETUP ── */
#setup{padding:20px;max-width:500px;margin:0 auto;}
.topic-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.topic-btn{padding:14px 18px;border-radius:14px;border:2px solid #333;background:#1a1a1a;color:#aaa;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;text-align:center;transition:all .15s;}
.topic-btn.on{border-color:currentColor;background:currentColor;color:#fff;}
.topic-btn.on span{color:#fff;}
.play-btn{width:100%;padding:16px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;margin-top:8px;}

/* ── GAME ── */
#game{display:none;padding:20px;max-width:500px;margin:0 auto;}
.progress{font-size:13px;color:#666;margin-bottom:16px;text-align:center;}
.question-card{background:#1e1e1e;border-radius:18px;padding:32px 24px;text-align:center;margin-bottom:16px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.question-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;}
.question-text{font-size:clamp(26px,6vw,44px);font-weight:900;color:#eee;line-height:1.3;direction:ltr;unicode-bidi:plaintext;}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.opt-btn{padding:18px 16px;background:#1e1e1e;border:2px solid #333;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;color:#ddd;cursor:pointer;text-align:center;line-height:1.3;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:all .1s;direction:ltr;unicode-bidi:plaintext;width:100%;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:#1a3020;border-color:#5a9a4e;color:#7ab86e;}
.opt-btn.wrong{background:#2e1818;border-color:#cc7a7a;color:#cc7a7a;}
.opt-btn.reveal{background:#1a3020;border-color:#5a9a4e;color:#7ab86e;}
.opt-spk{font-size:16px;opacity:0.4;flex-shrink:0;background:none;border:none;cursor:pointer;padding:4px 6px;color:inherit;touch-action:manipulation;}
.next-btn{width:100%;padding:14px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:none;}
.fact{font-size:13px;color:#888;text-align:center;padding:8px 4px;min-height:20px;font-style:italic;transition:opacity .3s;}
.stats-row{display:flex;gap:8px;margin-top:12px;}
.stat{flex:1;background:#1a1a1a;border-radius:12px;padding:10px 4px;text-align:center;}
.stat-n{font-size:20px;font-weight:900;}
.stat-n.g{color:#5a9a4e;}
.stat-n.r{color:#cc7a7a;}
.stat-n.b{color:#7aaac8;}
.stat-l{font-size:10px;color:#555;margin-top:2px;}

/* finish */
#finish{display:none;padding:40px 20px;max-width:500px;margin:0 auto;text-align:center;}
.score-big{font-size:64px;font-weight:900;color:#5a9a4e;}
.finish-btns{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
.btn-again{padding:15px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;}
.btn-back{padding:14px;background:#1e1e1e;color:#aaa;border:2px solid #333;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div id="setup">
  <div class="topic-list" id="topicList"></div>
  <div style="margin-bottom:16px;">
    <div style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center;">מספר שאלות</div>
    <div style="text-align:center;margin-bottom:6px;">
      <span id="qtyVal" style="font-size:26px;font-weight:900;color:#eee;">20</span>
    </div>
    <input type="range" id="qtyRange" min="10" max="100" step="10" value="20"
      oninput="document.getElementById('qtyVal').textContent=this.value"
      style="width:100%;accent-color:#5a9a4e;cursor:pointer;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-top:2px;">
      <span>10</span><span>50</span><span>100</span>
    </div>
  </div>
  <button class="play-btn" onclick="startGame()">▶ שחק</button>
</div>

<div id="game">
  <div class="progress" id="progress">0 / 0</div>
  <div class="question-card" style="position:relative;">
    <button onclick="sayIt(document.getElementById('qText').textContent, currentSrc, currentRev)" style="position:absolute;top:10px;left:10px;background:none;border:none;font-size:18px;opacity:0.35;cursor:pointer;padding:6px;touch-action:manipulation;">🔊</button>
    <div class="question-label" id="qLabel"></div>
    <div class="question-text" id="qText"></div>
  </div>
  <div class="options" id="options"></div>
  <div class="fact" id="fact"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQ()">המשך ›</button>
  <div class="stats-row">
    <div class="stat"><div class="stat-n g" id="sRight">0</div><div class="stat-l">נכון</div></div>
    <div class="stat"><div class="stat-n r" id="sWrong">0</div><div class="stat-l">שגוי</div></div>
    <div class="stat"><div class="stat-n b" id="sLeft">0</div><div class="stat-l">נותרו</div></div>
    <div class="stat"><div class="stat-n" id="sPct">—</div><div class="stat-l">הצלחה</div></div>
  </div>
</div>

<div id="finish">
  <div class="score-big" id="finScore">—%</div>
  <div style="color:#666;font-size:13px;margin-top:8px;">מהסיבוב הראשון</div>
  <div id="origScore" style="display:none;color:#c8a850;font-size:13px;margin-top:4px;"></div>
  <div class="stats-row" style="margin-top:20px;">
    <div class="stat"><div class="stat-n g" id="finRight">0</div><div class="stat-l">נכון</div></div>
    <div class="stat"><div class="stat-n r" id="finWrong">0</div><div class="stat-l">שגוי</div></div>
    <div class="stat"><div class="stat-n b" id="finTotal">0</div><div class="stat-l">שאלות</div></div>
  </div>
  <div class="finish-btns">
    <button class="btn-again" onclick="startReview()" id="reviewBtn" style="background:#c8a850;">✏️ תקן טעויות</button>
    <button class="btn-again" onclick="restartGame()">סיבוב נוסף</button>
    <button class="btn-back" onclick="backToSetup()">בחירה חדשה</button>
  </div>
</div>

function cleanLang(text, wantHebrew) {
  if (!text) return text;
  // If contains " — " separator, split and pick side
  if (text.includes(' — ')) {
    const parts = text.split(' — ');
    const hebrewPart = parts.find(p => /[֐-׿]/.test(p));
    const foreignPart = parts.find(p => !/[֐-׿]/.test(p));
    if (wantHebrew) return (hebrewPart || parts[1] || parts[0]).trim();
    return (foreignPart || parts[0]).trim();
  }
  return text.trim();
}

function buildTopics() {
  const list = document.getElementById('topicList');
  list.innerHTML = '';

  const GROUPS = {
    'שפות': ['pt','english','spanish','japanese'],
    'בריאות ורפואה': ['drug','blood','nutrition','herbs'],
    'תרבות וידע': ['history','flags'],
  };

  const setKey = (key, on, el) => {
    const color = el.dataset.color;
    if (on) { selected.add(key); el.style.opacity='1'; el.style.background=color; el.style.borderColor=color; el.style.color='#fff'; }
    else { selected.delete(key); el.style.opacity='0.3'; el.style.background=color; el.style.borderColor=color; el.style.color='#fff'; }
  };

  // Drag on any container — prevents scroll during drag
  const setupDrag = (container) => {
    let dragMode = null, dragY = 0, moved = false;
    container.addEventListener('touchstart', e => {
      const el = e.target.closest('[data-key]') || e.target.closest('[data-src]') || e.target.closest('[data-group]');
      if (!el) return;
      dragY = e.touches[0].clientY;
      moved = false;
      const key = el.dataset.key || firstKey(el);
      dragMode = key ? !selected.has(key) : null;
    }, {passive: true});
    container.addEventListener('touchmove', e => {
      if (dragMode === null) return;
      if (Math.abs(e.touches[0].clientY - dragY) > 5) { moved = true; e.preventDefault(); }
      if (!moved) return;
      const pt = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      const el = pt && (pt.closest('[data-key]') || pt.closest('[data-src]') || pt.closest('[data-group]'));
      if (!el) return;
      // Toggle all keys under this element
      const keys = getKeys(el);
      keys.forEach(k => {
        const chip = container.querySelector(`[data-key="${k}"]`) || list.querySelector(`[data-key="${k}"]`);
        if (dragMode && !selected.has(k)) { selected.add(k); if(chip) { chip.style.opacity='1'; } }
        else if (!dragMode && selected.has(k)) { selected.delete(k); if(chip) { chip.style.opacity='0.3'; } }
      });
      // Update el appearance
      const allOn = keys.every(k => selected.has(k));
      el.style.opacity = allOn ? '1' : '0.3';
    }, {passive: false});
    container.addEventListener('touchend', () => { dragMode = null; moved = false; });
  };

  const firstKey = (el) => { const keys = getKeys(el); return keys[0] || null; };
  const getKeys = (el) => {
    if (el.dataset.key) return [el.dataset.key];
    if (el.dataset.src) return [...new Set((DATA_MAP[el.dataset.src]||[]).map(d=>d[0]))].map(cat=>el.dataset.src+'|'+cat);
    if (el.dataset.group) { const srcs = {'שפות':['pt','english','spanish','japanese'],'בריאות ורפואה':['drug','blood','nutrition','herbs'],'תרבות וידע':['history','flags']}[el.dataset.group]||[]; return srcs.flatMap(src=>[...new Set((DATA_MAP[src]||[]).map(d=>d[0]))].map(cat=>src+'|'+cat)); }
    return [];
  };

  // Setup tap (short=expand, long=toggle) on a button
  const setupTap = (btn, onShortTap, onLongTap) => {
    let timer = null, startY = 0;
    btn.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY;
      // Long press = toggle
      timer = setTimeout(() => { timer = null; onLongTap(); }, 400);
    }, {passive: true});
    btn.addEventListener('touchend', e => {
      if (timer) {
        clearTimeout(timer); timer = null;
        // Short tap = expand/collapse
        if (Math.abs(e.changedTouches[0].clientY - startY) < 10) onShortTap();
      }
    });
    btn.addEventListener('touchcancel', () => { if(timer){clearTimeout(timer);timer=null;} });
  };

  Object.entries(GROUPS).forEach(([groupName, sources]) => {
    const groupColor = '#555';
    const groupKeys = () => sources.flatMap(src=>[...new Set((DATA_MAP[src]||[]).map(d=>d[0]))].map(cat=>src+'|'+cat));

    // Group button
    const groupBtn = document.createElement('button');
    groupBtn.className = 'topic-btn on';
    groupBtn.dataset.group = groupName;
    groupBtn.dataset.groupcolor = groupColor;
    groupBtn.dataset.color = groupColor;
    groupBtn.style.cssText = `background:${groupColor};border-color:${groupColor};color:#fff;margin-top:10px;font-size:13px;`;
    groupBtn.textContent = groupName;
    list.appendChild(groupBtn);

    const groupWrap = document.createElement('div');
    groupWrap.style.cssText = 'display:none;flex-direction:column;gap:6px;padding:4px 0 2px 10px;';
    list.appendChild(groupWrap);

    setupTap(groupBtn,
      // short tap = expand/collapse
      () => { groupWrap.style.display = groupWrap.style.display==='flex' ? 'none' : 'flex'; },
      // long tap = toggle all
      () => {
        const keys = groupKeys(); const allOn = keys.every(k=>selected.has(k));
        keys.forEach(k => { selected[allOn?'delete':'add'](k); const el=list.querySelector(`[data-key="${k}"]`); if(el){el.style.background=allOn?'':el.dataset.color;el.style.borderColor=allOn?'#333':el.dataset.color;el.style.color=allOn?el.dataset.color:'#fff';} });
        groupBtn.style.opacity=allOn?'0.3':'1';
      }
    );

    sources.forEach(src => {
      const data = DATA_MAP[src]||[];
      if (!data.length) return;
      const cats = [...new Set(data.map(d=>d[0]))];
      const color = SOURCE_COLORS[src].bg;

      const srcBtn = document.createElement('button');
      srcBtn.className = 'topic-btn on';
      srcBtn.dataset.src = src;
      srcBtn.dataset.color = color;
      srcBtn.style.cssText = `background:${color};border-color:${color};color:#fff;`;
      srcBtn.textContent = SOURCE_LABELS[src];
      groupWrap.appendChild(srcBtn);

      const catWrap = document.createElement('div');
      catWrap.style.cssText = 'display:none;flex-direction:column;gap:4px;padding:4px 0 2px 10px;';
      groupWrap.appendChild(catWrap);

      cats.forEach(cat => {
        const key = src+'|'+cat;
        selected.add(key);
        const chip = document.createElement('button');
        chip.className = 'topic-btn on';
        chip.dataset.key = key;
        chip.dataset.color = color;
        chip.style.cssText = `background:${color};border-color:${color};color:#fff;font-size:12px;padding:8px 12px;`;
        chip.textContent = cat;
        catWrap.appendChild(chip);
      });

      setupTap(srcBtn,
        () => { catWrap.style.display = catWrap.style.display==='flex' ? 'none' : 'flex'; },
        () => {
          const allOn = cats.every(cat=>selected.has(src+'|'+cat));
          cats.forEach(cat => { const k=src+'|'+cat; const el=catWrap.querySelector(`[data-key="${k}"]`); if(el) setKey(k,!allOn,el); else selected[allOn?'delete':'add'](k); });
          srcBtn.style.opacity=allOn?'0.3':'1';
        }
      );

      // Short tap on cat chip = toggle
      catWrap.addEventListener('click', e => {
        const chip = e.target.closest('[data-key]');
        if (chip) { const on=!selected.has(chip.dataset.key); setKey(chip.dataset.key,on,chip); }
      });

      setupDrag(catWrap);
    });

    setupDrag(groupWrap);
  });

  setupDrag(list);
}
function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function sharesWord(a, b) {
  const wa = (a||'').toLowerCase().match(/[\w\u0590-\u05ff]{3,}/g) || [];
  const wb = new Set((b||'').toLowerCase().match(/[\w\u0590-\u05ff]{3,}/g) || []);
  return wa.some(w => wb.has(w));
}

function startGame() {
  if (selected.size === 0) { alert('בחר לפחות נושא אחד'); return; }
  allPool = [];
  selected.forEach(key => {
    const [src, cat] = key.split('|');
    const data = DATA_MAP[src] || [];
    data.filter(d => d[0] === cat).forEach(([c, q, a]) => {
      // Clean both q and a to single language
      const qClean = cleanLang(q, false); // foreign side (Spanish/PT/JP)
      const aClean = cleanLang(a, false); // translation (English)
      const qHeb = cleanLang(q, true);   // Hebrew side
      allPool.push({src, cat, q: qClean, a: aClean, rev:false});
      if (src !== 'flags') {
        // Reversed: question=English, answer=foreign word
        allPool.push({src, cat, q: aClean, a: qClean, rev:true});
      }
    });
  });
  if (allPool.length === 0) { alert('אין כרטיסים'); return; }
  const qty = parseInt(document.getElementById('qtyRange').value) || 20;
  // Build deck: one card per SOURCE per round (not per sub-category)
  const bySrc = {};
  allPool.forEach(c => {
    if (!bySrc[c.src]) bySrc[c.src] = [];
    bySrc[c.src].push(c);
  });
  Object.values(bySrc).forEach(arr => shuffle(arr));
  const srcKeys = shuffle(Object.keys(bySrc));
  deck = [];
  let ri = 0;
  while (deck.length < qty) {
    let added = 0;
    for (let si = 0; si < srcKeys.length && deck.length < qty; si++) {
      const arr = bySrc[srcKeys[si]];
      if (ri < arr.length) { deck.push(arr[ri]); added++; }
    }
    ri++;
    if (added === 0) break;
  }
  // Deduplicate and limit
  deck = [...new Map(deck.map(c => [c.src+'|'+c.q, c])).values()].slice(0, qty);
  shuffle(deck);
  right = 0; wrong = 0; total = deck.length;
  wrongCards = [];
  locked = false;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('finish').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  window.scrollTo(0,0);
  showQ();
}

function showQ() {
  if (deck.length === 0) { showFinish(); return; }
  current = deck.shift();
  currentSrc = current.src;
  currentRev = current.rev;
  locked = false;
  const done = total - deck.length;
  document.getElementById('progress').textContent = done + ' / ' + total;
  document.getElementById('sLeft').textContent = deck.length;
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  const t = right + wrong;
  document.getElementById('sPct').textContent = t > 0 ? Math.round(right/t*100) + '%' : '—';
  const lbl = SOURCE_LABELS[current.src] || current.src;
  document.getElementById('qLabel').textContent = lbl + ' · ' + current.cat;
  document.getElementById('qText').textContent = current.q;
  // Auto-detect direction
  const hasHebrew = /[֐-׿]/.test(current.q);
  document.getElementById('qText').style.direction = hasHebrew ? 'rtl' : 'ltr';
  document.getElementById('qText').style.textAlign = 'center';
  // Bigger flags
  if (current.src === 'flags') {
    document.getElementById('qText').style.fontSize = '80px';
    document.getElementById('qText').style.lineHeight = '1.1';
  } else {
    document.getElementById('qText').style.fontSize = '';
    document.getElementById('qText').style.lineHeight = '';
  }
  document.getElementById('fact').textContent = '';
  document.getElementById('fact').style.opacity = '0';
  document.getElementById('nextBtn').style.display = 'none';
  // Distractors
  // Find all correct answers for this question (same q, different a)
  const correctAnswers = new Set(allPool
    .filter(c => c.q === current.q || c.q.toLowerCase() === current.q.toLowerCase())
    .map(c => c.a.toLowerCase())
  );
  const pool = allPool.filter(c =>
    c.q !== current.q && c.a !== current.a && c.rev === current.rev &&
    !sharesWord(c.a, current.q) &&
    !correctAnswers.has(c.a.toLowerCase()) // exclude other valid answers for this q
  );
  const sameCat = shuffle(pool.filter(c => c.src===current.src && c.cat===current.cat));
  const sameSrc = shuffle(pool.filter(c => c.src===current.src && c.cat!==current.cat));
  const other   = shuffle(pool.filter(c => c.src!==current.src));
  const distractors = [];
  const seen = new Set([current.a]);
  for (const arr of [sameCat, sameSrc, other]) {
    for (const c of arr) {
      if (!seen.has(c.a) && distractors.length < 3) { seen.add(c.a); distractors.push(c); }
      if (distractors.length >= 3) break;
    }
    if (distractors.length >= 3) break;
  }
  const opts = shuffle([current, ...distractors]);
  const container = document.getElementById('options');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.key = opt.q;
    const txt = document.createElement('span');
    txt.textContent = opt.a;
    txt.style.cssText = 'flex:1;pointer-events:none;';
    btn.appendChild(txt);
    const spk = document.createElement('button');
    spk.className = 'opt-spk';
    spk.textContent = '🔊';
    spk.onclick = e => { e.stopPropagation(); sayIt(opt.a, opt.src, opt.rev); };
    btn.appendChild(spk);
    btn.onclick = () => pick(btn, opt);
    container.appendChild(btn);
  });
}

function pick(btn, opt) {
  if (locked) return;
  locked = true;
  const isRight = opt.q === current.q;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.key === current.q) b.classList.add('reveal');
  });
  if (isRight) { btn.classList.remove('reveal'); btn.classList.add('correct'); right++; }
  else { btn.classList.add('wrong'); wrong++; wrongCards.push(current); }
  saveState();
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').style.background = isRight ? '#5a9a4e' : '#cc7a7a';
  document.getElementById('nextBtn').textContent = isRight ? 'המשך ›' : 'הבנתי ›';
  const t = right + wrong;
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sPct').textContent = Math.round(right/t*100) + '%';
  // Fun fact — enrich about the CORRECT ANSWER
  const correctAnswer = current.a;
  let fact = getFact(correctAnswer) || getFact(current.q) || getGeneratedFact(correctAnswer, current.src, current.cat);
  const factEl = document.getElementById('fact');
  factEl.textContent = fact || '';
  factEl.style.opacity = fact ? '1' : '0';
}

function nextQ() { showQ(); }

function showFinish() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('finish').style.display = 'block';
  window.scrollTo(0,0);
  const t = right + wrong;
  const pct = t > 0 ? Math.round(right/t*100) : 0;
  if (originalScore === null) originalScore = pct; // save first round score
  const el = document.getElementById('finScore');
  el.textContent = pct + '%';
  // Show original score if in review mode
  const origEl = document.getElementById('origScore');
  if (origEl) {
    if (originalScore !== null && originalScore !== pct) {
      origEl.textContent = 'ציון מקורי: ' + originalScore + '%';
      origEl.style.display = 'block';
    } else { origEl.style.display = 'none'; }
  }
  el.style.color = pct>=80 ? '#5a9a4e' : pct>=60 ? '#c8a850' : '#cc7a7a';
  document.getElementById('finRight').textContent = right;
  const rb = document.getElementById('reviewBtn');
  if (rb) rb.style.display = wrongCards.length > 0 ? 'block' : 'none';
  document.getElementById('finWrong').textContent = wrong;
  document.getElementById('finTotal').textContent = t;
  if (pct === 100) confetti();
}


function startReview() {
  if (wrongCards.length === 0) { alert('אין טעויות לתיקון!'); return; }

  document.getElementById('finish').style.display = 'none';

function sayIt(text, src, rev) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  const lm = {
    pt:'pt-PT', drug:'en-US', herbs:'en-US', english:'en-US',
    japanese:'ja-JP', nutrition:'en-US', flags:'en-US',
    history:'he-IL', blood:'he-IL', spanish:'es-ES'
  };
  let lang = lm[src] || 'en-US';
  if (src === 'pt' && !rev) lang = 'pt-PT';
  // Clean text
  text = (text || '')
    .replace(/[一-鿿㐀-䶿]/g, '')
    .replace(/\s*—.*$/, '')
    .trim();
  if (!text) return;
  // Cancel then wait before speaking (Android fix)
  synth.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.85;
    u.volume = 1;
    // Try to pick matching voice
    const voices = synth.getVoices();
    if (voices.length) {
      const match = voices.find(v => v.lang === lang)
        || voices.find(v => v.lang.startsWith(lang.split('-')[0]));
      if (match) u.voice = match;
    }
    synth.speak(u);
  }, 100);
}

// ── SAVE / RESTORE STATE ──
function saveState() {
  if (!deck || total === 0) return;
  const state = {
    deck: deck.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    current: current ? {src:current.src,cat:current.cat,q:current.q,a:current.a,rev:current.rev} : null,
    allPool: allPool.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    right, wrong, total,
    wrongCards: wrongCards.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    originalScore,
    selected: [...selected],
    ts: Date.now()
  };
  try { localStorage.setItem('tok_state', JSON.stringify(state)); } catch(e) {}
}

function clearState() {
  try { localStorage.removeItem('tok_state'); } catch(e) {}
}

function restoreState() {
  try {
    const raw = localStorage.getItem('tok_state');
    if (!raw) return false;
    const s = JSON.parse(raw);
    // Only restore if saved less than 24 hours ago
    if (Date.now() - s.ts > 86400000) { clearState(); return false; }
    if (!s.deck || !s.total) return false;

    // Restore game state
    deck = s.deck;
    current = s.current;
    allPool = s.allPool;
    right = s.right; wrong = s.wrong; total = s.total;
    wrongCards = s.wrongCards || [];
    originalScore = s.originalScore;
    selected = new Set(s.selected || []);

    // Go straight to game screen
    document.getElementById('setup').style.display = 'none';
    document.getElementById('finish').style.display = 'none';
    const gameEl = document.getElementById('game');
    gameEl.style.display = 'block';

    // Add a banner
    const banner = document.createElement('div');
    banner.id = 'continueBanner';
    banner.style.cssText = 'background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#aaa;';
    banner.innerHTML = '<span>ממשיך מהמקום שעצרת</span><button onclick="restartFresh()" style="background:none;border:none;color:#666;font-size:12px;cursor:pointer;padding:4px 8px;">התחל מחדש</button>';
    gameEl.insertBefore(banner, gameEl.firstChild);

    showQ();
    return true;
  } catch(e) { clearState(); return false; }
}

function restartFresh() {
  clearState();
  const banner = document.getElementById('continueBanner');
  if (banner) banner.remove();
  document.getElementById('game').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  window.scrollTo(0,0);
}

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%23111'/%3E%3Ctext x='256' y='340' font-size='320' text-anchor='middle'%3E🌳%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שאלון</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#111;color:#eee;min-height:100vh;overscroll-behavior-y:none;}

/* ── SETUP ── */
#setup{padding:20px;max-width:500px;margin:0 auto;}
.topic-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.topic-btn{padding:14px 18px;border-radius:14px;border:2px solid #333;background:#1a1a1a;color:#aaa;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;text-align:center;transition:all .15s;}
.topic-btn.on{border-color:currentColor;background:currentColor;color:#fff;}
.topic-btn.on span{color:#fff;}
.play-btn{width:100%;padding:16px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;margin-top:8px;}

/* ── GAME ── */
#game{display:none;padding:20px;max-width:500px;margin:0 auto;}
.progress{font-size:13px;color:#666;margin-bottom:16px;text-align:center;}
.question-card{background:#1e1e1e;border-radius:18px;padding:32px 24px;text-align:center;margin-bottom:16px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.question-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px;}
.question-text{font-size:clamp(26px,6vw,44px);font-weight:900;color:#eee;line-height:1.3;direction:ltr;unicode-bidi:plaintext;}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.opt-btn{padding:18px 16px;background:#1e1e1e;border:2px solid #333;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;color:#ddd;cursor:pointer;text-align:center;line-height:1.3;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:all .1s;direction:ltr;unicode-bidi:plaintext;width:100%;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:#1a3020;border-color:#5a9a4e;color:#7ab86e;}
.opt-btn.wrong{background:#2e1818;border-color:#cc7a7a;color:#cc7a7a;}
.opt-btn.reveal{background:#1a3020;border-color:#5a9a4e;color:#7ab86e;}
.opt-spk{font-size:16px;opacity:0.4;flex-shrink:0;background:none;border:none;cursor:pointer;padding:4px 6px;color:inherit;touch-action:manipulation;}
.next-btn{width:100%;padding:14px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;display:none;}
.fact{font-size:13px;color:#888;text-align:center;padding:8px 4px;min-height:20px;font-style:italic;transition:opacity .3s;}
.stats-row{display:flex;gap:8px;margin-top:12px;}
.stat{flex:1;background:#1a1a1a;border-radius:12px;padding:10px 4px;text-align:center;}
.stat-n{font-size:20px;font-weight:900;}
.stat-n.g{color:#5a9a4e;}
.stat-n.r{color:#cc7a7a;}
.stat-n.b{color:#7aaac8;}
.stat-l{font-size:10px;color:#555;margin-top:2px;}

/* finish */
#finish{display:none;padding:40px 20px;max-width:500px;margin:0 auto;text-align:center;}
.score-big{font-size:64px;font-weight:900;color:#5a9a4e;}
.finish-btns{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
.btn-again{padding:15px;background:#5a9a4e;color:#fff;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;}
.btn-back{padding:14px;background:#1e1e1e;color:#aaa;border:2px solid #333;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div id="setup">
  <div class="topic-list" id="topicList"></div>
  <div style="margin-bottom:16px;">
    <div style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center;">מספר שאלות</div>
    <div style="text-align:center;margin-bottom:6px;">
      <span id="qtyVal" style="font-size:26px;font-weight:900;color:#eee;">20</span>
    </div>
    <input type="range" id="qtyRange" min="10" max="100" step="10" value="20"
      oninput="document.getElementById('qtyVal').textContent=this.value"
      style="width:100%;accent-color:#5a9a4e;cursor:pointer;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-top:2px;">
      <span>10</span><span>50</span><span>100</span>
    </div>
  </div>
  <button class="play-btn" onclick="startGame()">▶ שחק</button>
</div>

<div id="game">
  <div class="progress" id="progress">0 / 0</div>
  <div class="question-card" style="position:relative;">
    <button onclick="sayIt(document.getElementById('qText').textContent, currentSrc, currentRev)" style="position:absolute;top:10px;left:10px;background:none;border:none;font-size:18px;opacity:0.35;cursor:pointer;padding:6px;touch-action:manipulation;">🔊</button>
    <div class="question-label" id="qLabel"></div>
    <div class="question-text" id="qText"></div>
  </div>
  <div class="options" id="options"></div>
  <div class="fact" id="fact"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQ()">המשך ›</button>
  <div class="stats-row">
    <div class="stat"><div class="stat-n g" id="sRight">0</div><div class="stat-l">נכון</div></div>
    <div class="stat"><div class="stat-n r" id="sWrong">0</div><div class="stat-l">שגוי</div></div>
    <div class="stat"><div class="stat-n b" id="sLeft">0</div><div class="stat-l">נותרו</div></div>
    <div class="stat"><div class="stat-n" id="sPct">—</div><div class="stat-l">הצלחה</div></div>
  </div>
</div>

<div id="finish">
  <div class="score-big" id="finScore">—%</div>
  <div style="color:#666;font-size:13px;margin-top:8px;">מהסיבוב הראשון</div>
  <div id="origScore" style="display:none;color:#c8a850;font-size:13px;margin-top:4px;"></div>
  <div class="stats-row" style="margin-top:20px;">
    <div class="stat"><div class="stat-n g" id="finRight">0</div><div class="stat-l">נכון</div></div>
    <div class="stat"><div class="stat-n r" id="finWrong">0</div><div class="stat-l">שגוי</div></div>
    <div class="stat"><div class="stat-n b" id="finTotal">0</div><div class="stat-l">שאלות</div></div>
  </div>
  <div class="finish-btns">
    <button class="btn-again" onclick="startReview()" id="reviewBtn" style="background:#c8a850;">✏️ תקן טעויות</button>
    <button class="btn-again" onclick="restartGame()">סיבוב נוסף</button>
    <button class="btn-back" onclick="backToSetup()">בחירה חדשה</button>
  </div>
</div>

  english:ENGLISH_DATA, japanese:JAPANESE_DATA, nutrition:NUTRITION_DATA,
  history:HISTORY_DATA, blood:BLOOD_DATA, spanish:SPANISH_DATA
};

// ── STATE ──
let selected = new Set(); // selected source|cat keys
let deck = [], current = null, locked = false;

let right = 0, wrong = 0, total = 0;
let currentSrc = '', currentRev = false;
let wrongCards = [];
let originalScore = null;
let allPool = [];

// ── SETUP ──

function cleanLang(text, wantHebrew) {
  if (!text) return text;
  // If contains " — " separator, split and pick side
  if (text.includes(' — ')) {
    const parts = text.split(' — ');
    const hebrewPart = parts.find(p => /[֐-׿]/.test(p));
    const foreignPart = parts.find(p => !/[֐-׿]/.test(p));
    if (wantHebrew) return (hebrewPart || parts[1] || parts[0]).trim();
    return (foreignPart || parts[0]).trim();
  }
  return text.trim();
}

function buildTopics() {
  const list = document.getElementById('topicList');
  list.innerHTML = '';

  const GROUPS = {
    'שפות': ['pt','english','spanish','japanese'],
    'בריאות ורפואה': ['drug','blood','nutrition','herbs'],
    'תרבות וידע': ['history','flags'],
  };

  const setKey = (key, on, el) => {
    const color = el.dataset.color;
    if (on) { selected.add(key); el.style.opacity='1'; el.style.background=color; el.style.borderColor=color; el.style.color='#fff'; }
    else { selected.delete(key); el.style.opacity='0.3'; el.style.background=color; el.style.borderColor=color; el.style.color='#fff'; }
  };

  // Drag on any container — prevents scroll during drag
  const setupDrag = (container) => {
    let dragMode = null, dragY = 0, moved = false;
    container.addEventListener('touchstart', e => {
      const el = e.target.closest('[data-key]') || e.target.closest('[data-src]') || e.target.closest('[data-group]');
      if (!el) return;
      dragY = e.touches[0].clientY;
      moved = false;
      const key = el.dataset.key || firstKey(el);
      dragMode = key ? !selected.has(key) : null;
    }, {passive: true});
    container.addEventListener('touchmove', e => {
      if (dragMode === null) return;
      if (Math.abs(e.touches[0].clientY - dragY) > 5) { moved = true; e.preventDefault(); }
      if (!moved) return;
      const pt = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      const el = pt && (pt.closest('[data-key]') || pt.closest('[data-src]') || pt.closest('[data-group]'));
      if (!el) return;
      // Toggle all keys under this element
      const keys = getKeys(el);
      keys.forEach(k => {
        const chip = container.querySelector(`[data-key="${k}"]`) || list.querySelector(`[data-key="${k}"]`);
        if (dragMode && !selected.has(k)) { selected.add(k); if(chip) { chip.style.opacity='1'; } }
        else if (!dragMode && selected.has(k)) { selected.delete(k); if(chip) { chip.style.opacity='0.3'; } }
      });
      // Update el appearance
      const allOn = keys.every(k => selected.has(k));
      el.style.opacity = allOn ? '1' : '0.3';
    }, {passive: false});
    container.addEventListener('touchend', () => { dragMode = null; moved = false; });
  };

  const firstKey = (el) => { const keys = getKeys(el); return keys[0] || null; };
  const getKeys = (el) => {
    if (el.dataset.key) return [el.dataset.key];
    if (el.dataset.src) return [...new Set((DATA_MAP[el.dataset.src]||[]).map(d=>d[0]))].map(cat=>el.dataset.src+'|'+cat);
    if (el.dataset.group) { const srcs = {'שפות':['pt','english','spanish','japanese'],'בריאות ורפואה':['drug','blood','nutrition','herbs'],'תרבות וידע':['history','flags']}[el.dataset.group]||[]; return srcs.flatMap(src=>[...new Set((DATA_MAP[src]||[]).map(d=>d[0]))].map(cat=>src+'|'+cat)); }
    return [];
  };

  // Setup tap (short=expand, long=toggle) on a button
  const setupTap = (btn, onShortTap, onLongTap) => {
    let timer = null, startY = 0;
    btn.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY;
      // Long press = toggle
      timer = setTimeout(() => { timer = null; onLongTap(); }, 400);
    }, {passive: true});
    btn.addEventListener('touchend', e => {
      if (timer) {
        clearTimeout(timer); timer = null;
        // Short tap = expand/collapse
        if (Math.abs(e.changedTouches[0].clientY - startY) < 10) onShortTap();
      }
    });
    btn.addEventListener('touchcancel', () => { if(timer){clearTimeout(timer);timer=null;} });
  };

  Object.entries(GROUPS).forEach(([groupName, sources]) => {
    const groupColor = '#555';
    const groupKeys = () => sources.flatMap(src=>[...new Set((DATA_MAP[src]||[]).map(d=>d[0]))].map(cat=>src+'|'+cat));

    // Group button
    const groupBtn = document.createElement('button');
    groupBtn.className = 'topic-btn on';
    groupBtn.dataset.group = groupName;
    groupBtn.dataset.groupcolor = groupColor;
    groupBtn.dataset.color = groupColor;
    groupBtn.style.cssText = `background:${groupColor};border-color:${groupColor};color:#fff;margin-top:10px;font-size:13px;`;
    groupBtn.textContent = groupName;
    list.appendChild(groupBtn);

    const groupWrap = document.createElement('div');
    groupWrap.style.cssText = 'display:none;flex-direction:column;gap:6px;padding:4px 0 2px 10px;';
    list.appendChild(groupWrap);

    setupTap(groupBtn,
      // short tap = expand/collapse
      () => { groupWrap.style.display = groupWrap.style.display==='flex' ? 'none' : 'flex'; },
      // long tap = toggle all
      () => {
        const keys = groupKeys(); const allOn = keys.every(k=>selected.has(k));
        keys.forEach(k => { selected[allOn?'delete':'add'](k); const el=list.querySelector(`[data-key="${k}"]`); if(el){el.style.background=allOn?'':el.dataset.color;el.style.borderColor=allOn?'#333':el.dataset.color;el.style.color=allOn?el.dataset.color:'#fff';} });
        groupBtn.style.opacity=allOn?'0.3':'1';
      }
    );

    sources.forEach(src => {
      const data = DATA_MAP[src]||[];
      if (!data.length) return;
      const cats = [...new Set(data.map(d=>d[0]))];
      const color = SOURCE_COLORS[src].bg;

      const srcBtn = document.createElement('button');
      srcBtn.className = 'topic-btn on';
      srcBtn.dataset.src = src;
      srcBtn.dataset.color = color;
      srcBtn.style.cssText = `background:${color};border-color:${color};color:#fff;`;
      srcBtn.textContent = SOURCE_LABELS[src];
      groupWrap.appendChild(srcBtn);

      const catWrap = document.createElement('div');
      catWrap.style.cssText = 'display:none;flex-direction:column;gap:4px;padding:4px 0 2px 10px;';
      groupWrap.appendChild(catWrap);

      cats.forEach(cat => {
        const key = src+'|'+cat;
        selected.add(key);
        const chip = document.createElement('button');
        chip.className = 'topic-btn on';
        chip.dataset.key = key;
        chip.dataset.color = color;
        chip.style.cssText = `background:${color};border-color:${color};color:#fff;font-size:12px;padding:8px 12px;`;
        chip.textContent = cat;
        catWrap.appendChild(chip);
      });

      setupTap(srcBtn,
        () => { catWrap.style.display = catWrap.style.display==='flex' ? 'none' : 'flex'; },
        () => {
          const allOn = cats.every(cat=>selected.has(src+'|'+cat));
          cats.forEach(cat => { const k=src+'|'+cat; const el=catWrap.querySelector(`[data-key="${k}"]`); if(el) setKey(k,!allOn,el); else selected[allOn?'delete':'add'](k); });
          srcBtn.style.opacity=allOn?'0.3':'1';
        }
      );

      // Short tap on cat chip = toggle
      catWrap.addEventListener('click', e => {
        const chip = e.target.closest('[data-key]');
        if (chip) { const on=!selected.has(chip.dataset.key); setKey(chip.dataset.key,on,chip); }
      });

      setupDrag(catWrap);
    });

    setupDrag(groupWrap);
  });

  setupDrag(list);
}
function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function sharesWord(a, b) {
  const wa = (a||'').toLowerCase().match(/[\w\u0590-\u05ff]{3,}/g) || [];
  const wb = new Set((b||'').toLowerCase().match(/[\w\u0590-\u05ff]{3,}/g) || []);
  return wa.some(w => wb.has(w));
}

function startGame() {
  if (selected.size === 0) { alert('בחר לפחות נושא אחד'); return; }
  allPool = [];
  selected.forEach(key => {
    const [src, cat] = key.split('|');
    const data = DATA_MAP[src] || [];
    data.filter(d => d[0] === cat).forEach(([c, q, a]) => {
      // Clean both q and a to single language
      const qClean = cleanLang(q, false); // foreign side (Spanish/PT/JP)
      const aClean = cleanLang(a, false); // translation (English)
      const qHeb = cleanLang(q, true);   // Hebrew side
      allPool.push({src, cat, q: qClean, a: aClean, rev:false});
      if (src !== 'flags') {
        // Reversed: question=English, answer=foreign word
        allPool.push({src, cat, q: aClean, a: qClean, rev:true});
      }
    });
  });
  if (allPool.length === 0) { alert('אין כרטיסים'); return; }
  const qty = parseInt(document.getElementById('qtyRange').value) || 20;
  // Build deck: one card per category (round-robin for variety)
  const byCat = {};
  allPool.forEach(c => {
    const key = c.src + '|' + c.cat;
    if (!byCat[key]) byCat[key] = [];
    byCat[key].push(c);
  });
  Object.values(byCat).forEach(arr => shuffle(arr));
  const catKeys = shuffle(Object.keys(byCat));
  deck = [];
  let ri = 0;
  while (deck.length < qty) {
    let added = 0;
    for (let ci = 0; ci < catKeys.length && deck.length < qty; ci++) {
      const arr = byCat[catKeys[ci]];
      const card = arr[ri % arr.length];
      if (card) { deck.push(card); added++; }
    }
    ri++;
    if (added === 0 || ri > 50) break;
  }
  // Remove duplicates then shuffle
  deck = [...new Map(deck.map(c => [c.src+'|'+c.cat+'|'+c.q, c])).values()].slice(0, qty);
  shuffle(deck);
  right = 0; wrong = 0; total = deck.length;
  wrongCards = [];
  locked = false;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('finish').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  window.scrollTo(0,0);
  showQ();
}

function showQ() {
  if (deck.length === 0) { showFinish(); return; }
  current = deck.shift();
  currentSrc = current.src;
  currentRev = current.rev;
  locked = false;
  const done = total - deck.length;
  document.getElementById('progress').textContent = done + ' / ' + total;
  document.getElementById('sLeft').textContent = deck.length;
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  const t = right + wrong;
  document.getElementById('sPct').textContent = t > 0 ? Math.round(right/t*100) + '%' : '—';
  const lbl = SOURCE_LABELS[current.src] || current.src;
  document.getElementById('qLabel').textContent = lbl + ' · ' + current.cat;
  document.getElementById('qText').textContent = current.q;
  // Auto-detect direction
  const hasHebrew = /[֐-׿]/.test(current.q);
  document.getElementById('qText').style.direction = hasHebrew ? 'rtl' : 'ltr';
  document.getElementById('qText').style.textAlign = 'center';
  // Bigger flags
  if (current.src === 'flags') {
    document.getElementById('qText').style.fontSize = '80px';
    document.getElementById('qText').style.lineHeight = '1.1';
  } else {
    document.getElementById('qText').style.fontSize = '';
    document.getElementById('qText').style.lineHeight = '';
  }
  document.getElementById('fact').textContent = '';
  document.getElementById('fact').style.opacity = '0';
  document.getElementById('nextBtn').style.display = 'none';
  // Distractors
  // Find all correct answers for this question (same q, different a)
  const correctAnswers = new Set(allPool
    .filter(c => c.q === current.q || c.q.toLowerCase() === current.q.toLowerCase())
    .map(c => c.a.toLowerCase())
  );
  const pool = allPool.filter(c =>
    c.q !== current.q && c.a !== current.a && c.rev === current.rev &&
    !sharesWord(c.a, current.q) &&
    !correctAnswers.has(c.a.toLowerCase()) // exclude other valid answers for this q
  );
  const sameCat = shuffle(pool.filter(c => c.src===current.src && c.cat===current.cat));
  const sameSrc = shuffle(pool.filter(c => c.src===current.src && c.cat!==current.cat));
  const other   = shuffle(pool.filter(c => c.src!==current.src));
  const distractors = [];
  const seen = new Set([current.a]);
  for (const arr of [sameCat, sameSrc, other]) {
    for (const c of arr) {
      if (!seen.has(c.a) && distractors.length < 3) { seen.add(c.a); distractors.push(c); }
      if (distractors.length >= 3) break;
    }
    if (distractors.length >= 3) break;
  }
  const opts = shuffle([current, ...distractors]);
  const container = document.getElementById('options');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.key = opt.q;
    const txt = document.createElement('span');
    txt.textContent = opt.a;
    txt.style.cssText = 'flex:1;pointer-events:none;';
    btn.appendChild(txt);
    const spk = document.createElement('button');
    spk.className = 'opt-spk';
    spk.textContent = '🔊';
    spk.onclick = e => { e.stopPropagation(); sayIt(opt.a, opt.src, opt.rev); };
    btn.appendChild(spk);
    btn.onclick = () => pick(btn, opt);
    container.appendChild(btn);
  });
}

function pick(btn, opt) {
  if (locked) return;
  locked = true;
  const isRight = opt.q === current.q;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.key === current.q) b.classList.add('reveal');
  });
  if (isRight) { btn.classList.remove('reveal'); btn.classList.add('correct'); right++; }
  else { btn.classList.add('wrong'); wrong++; wrongCards.push(current); }
  saveState();
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').style.background = isRight ? '#5a9a4e' : '#cc7a7a';
  document.getElementById('nextBtn').textContent = isRight ? 'המשך ›' : 'הבנתי ›';
  const t = right + wrong;
  document.getElementById('sRight').textContent = right;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sPct').textContent = Math.round(right/t*100) + '%';
  // Fun fact — enrich about the CORRECT ANSWER
  const correctAnswer = current.a;
  let fact = getFact(correctAnswer) || getFact(current.q) || getGeneratedFact(correctAnswer, current.src, current.cat);
  const factEl = document.getElementById('fact');
  factEl.textContent = fact || '';
  factEl.style.opacity = fact ? '1' : '0';
}

function nextQ() { showQ(); }

function showFinish() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('finish').style.display = 'block';
  window.scrollTo(0,0);
  const t = right + wrong;
  const pct = t > 0 ? Math.round(right/t*100) : 0;
  if (originalScore === null) originalScore = pct; // save first round score
  const el = document.getElementById('finScore');
  el.textContent = pct + '%';
  // Show original score if in review mode
  const origEl = document.getElementById('origScore');
  if (origEl) {
    if (originalScore !== null && originalScore !== pct) {
      origEl.textContent = 'ציון מקורי: ' + originalScore + '%';
      origEl.style.display = 'block';
    } else { origEl.style.display = 'none'; }
  }
  el.style.color = pct>=80 ? '#5a9a4e' : pct>=60 ? '#c8a850' : '#cc7a7a';
  document.getElementById('finRight').textContent = right;
  const rb = document.getElementById('reviewBtn');
  if (rb) rb.style.display = wrongCards.length > 0 ? 'block' : 'none';
  document.getElementById('finWrong').textContent = wrong;
  document.getElementById('finTotal').textContent = t;
  if (pct === 100) confetti();
}


function startReview() {
  if (wrongCards.length === 0) { alert('אין טעויות לתיקון!'); return; }
  // Keep full allPool for distractors but filter to same src/cat
  deck = shuffle([...wrongCards]);
  right = 0; wrong = 0; total = deck.length;
  wrongCards = [];
  locked = false;
  document.getElementById('finish').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  window.scrollTo(0,0);
  showQ();
}

function restartGame() { startGame(); }

function backToSetup() {
  clearState();
  document.getElementById('game').style.display = 'none';
  document.getElementById('finish').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  window.scrollTo(0,0);
  originalScore = null;
}

function sayIt(text, src, rev) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  const lm = {
    pt:'pt-PT', drug:'en-US', herbs:'en-US', english:'en-US',
    japanese:'ja-JP', nutrition:'en-US', flags:'en-US',
    history:'he-IL', blood:'he-IL', spanish:'es-ES'
  };
  let lang = lm[src] || 'en-US';
  if (src === 'pt' && !rev) lang = 'pt-PT';
  // Clean text
  text = (text || '')
    .replace(/[一-鿿㐀-䶿]/g, '')
    .replace(/\s*—.*$/, '')
    .trim();
  if (!text) return;
  // Cancel then wait before speaking (Android fix)
  synth.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.85;
    u.volume = 1;
    // Try to pick matching voice
    const voices = synth.getVoices();
    if (voices.length) {
      const match = voices.find(v => v.lang === lang)
        || voices.find(v => v.lang.startsWith(lang.split('-')[0]));
      if (match) u.voice = match;
    }
    synth.speak(u);
  }, 100);
}
// Pre-warm voices on first user interaction

function getFact(text) {
  const t = (text||'').toLowerCase();
  for (const [key, fact] of Object.entries(FUN_FACTS)) {
    if (t.includes(key)) return '💡 ' + fact;
  }
  return '';

function confetti() {
  const colors=['#5a9a4e','#c8a850','#7aaac8','#cc7a7a','#eee'];
  for(let i=0;i<80;i++){
    setTimeout(()=>{
      const d=document.createElement('div');

// ── SAVE / RESTORE STATE ──
function saveState() {
  if (!deck || total === 0) return;
  const state = {
    deck: deck.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    current: current ? {src:current.src,cat:current.cat,q:current.q,a:current.a,rev:current.rev} : null,
    allPool: allPool.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    right, wrong, total,
    wrongCards: wrongCards.map(c => ({src:c.src,cat:c.cat,q:c.q,a:c.a,rev:c.rev})),
    originalScore,
    selected: [...selected],
    ts: Date.now()
  };
  try { localStorage.setItem('tok_state', JSON.stringify(state)); } catch(e) {}
}

function clearState() {
  try { localStorage.removeItem('tok_state'); } catch(e) {}
}

function restoreState() {
  try {
    const raw = localStorage.getItem('tok_state');
    if (!raw) return false;
    const s = JSON.parse(raw);
    // Only restore if saved less than 24 hours ago
    if (Date.now() - s.ts > 86400000) { clearState(); return false; }
    if (!s.deck || !s.total) return false;

    // Restore game state
    deck = s.deck;
    current = s.current;
    allPool = s.allPool;
    right = s.right; wrong = s.wrong; total = s.total;
    wrongCards = s.wrongCards || [];
    originalScore = s.originalScore;
    selected = new Set(s.selected || []);

    // Go straight to game screen
    document.getElementById('setup').style.display = 'none';
    document.getElementById('finish').style.display = 'none';
    const gameEl = document.getElementById('game');
    gameEl.style.display = 'block';

    // Add a banner
    const banner = document.createElement('div');
    banner.id = 'continueBanner';
    banner.style.cssText = 'background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#aaa;';
    banner.innerHTML = '<span>ממשיך מהמקום שעצרת</span><button onclick="restartFresh()" style="background:none;border:none;color:#666;font-size:12px;cursor:pointer;padding:4px 8px;">התחל מחדש</button>';
    gameEl.insertBefore(banner, gameEl.firstChild);

    showQ();
    return true;
  } catch(e) { clearState(); return false; }
}

function restartFresh() {
  clearState();
  const banner = document.getElementById('continueBanner');
  if (banner) banner.remove();
  document.getElementById('game').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  window.scrollTo(0,0);
}


buildTopics();
restoreState();

<script>
if ('serviceWorker' in navigator) {
  const swCode = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
self.addEventListener('fetch', e => e.respondWith(
  caches.open('tok-v1').then(cache =>
    cache.match(e.request).then(cached => {
      const fresh = fetch(e.request).then(r => { cache.put(e.request, r.clone()); return r; }).catch(() => cached);
      return cached || fresh;
    })
  )
));`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
